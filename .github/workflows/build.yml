name: Build MonitorSwitcher

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:      # lets you start a build by hand from the Actions tab

permissions:
  contents: write         # needed to attach the exe to a Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file exe
        run: >
          dotnet publish src/MonitorSwitcher.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -p:DebugSymbols=false
          -o publish

      - name: Upload exe as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonitorSwitcher
          path: publish/MonitorSwitcher.exe

      - name: Attach exe to a GitHub Release (only when you push a tag like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/MonitorSwitcher.exe
